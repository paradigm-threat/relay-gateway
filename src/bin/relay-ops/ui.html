<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay Fleet</title>
<link rel="icon" href="/favicon.png">
<style>
  :root { --bg:#0f1419; --fg:#e7ecf1; --muted:#8b98a5; --ok:#3dd68c; --bad:#f07178; --warn:#e6c07b; --card:#1a2332; --line:#2a3544; --accent:#59c2ff; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line); }
  h1 { font-size:1.1rem; margin:0; font-weight:600; letter-spacing:.02em; }
  .muted { color:var(--muted); }
  button, .btn { background:#243044; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  main { padding:16px 20px 48px; display:grid; gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .pill { font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .pill.ok { color:var(--ok); border-color:#2a5; }
  .pill.bad { color:var(--bad); border-color:#a44; }
  .pill.warn { color:var(--warn); border-color:#a80; }
  .actions { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  pre { white-space:pre-wrap; background:#0b1016; border:1px solid var(--line); padding:10px; border-radius:8px; max-height:240px; overflow:auto; font-size:12px; }
  .err { color:var(--bad); }
  .warn-list { margin:8px 0 0; padding-left:18px; color:var(--warn); }
  .warn-list li { margin:4px 0; }
</style>
</head>
<body>
<header>
  <h1>Relay Fleet</h1>
  <span id="mode" class="pill">…</span>
  <span id="credit" class="pill">…</span>
  <span id="topo" class="muted"></span>
  <div class="row" style="margin-left:auto">
    <button id="refresh">Refresh</button>
    <button id="warmAll">Warm indexes</button>
    <button id="fleetDns">Fleet DNS</button>
    <button id="knownHosts">Reset known_hosts</button>
  </div>
</header>
<main>
  <div id="banner" class="card muted">Loading…</div>
  <div id="nodes"></div>
  <div class="card">
    <div class="muted">Job log</div>
    <pre id="job">—</pre>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let snap = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  const t = await r.text();
  if (!r.ok) throw new Error(t || r.statusText);
  try { return JSON.parse(t); } catch { return t; }
}

function pill(ok, label, kind) {
  const cls = kind || (ok ? 'ok' : 'bad');
  return `<span class="pill ${cls}">${label}</span>`;
}

function render() {
  if (!snap) return;
  const inv = snap.inventory || {};
  $('mode').textContent = inv.admin_ready ? 'Admin' : 'Observer';
  $('mode').className = 'pill ' + (inv.admin_ready ? 'ok' : '');
  $('topo').textContent = (snap.topology_source || '') + ' · ' + (snap.gitlab_url || '');
  const c = snap.credit;
  if (c) {
    const d = c.days_to_scale_down_target;
    const label = c.scale_down_due
      ? `Credit scale-down due · ${d.toFixed(1)}d`
      : `${c.promo} · ${d.toFixed(1)}d to scale-down · $${c.credit_usd}`;
    $('credit').textContent = label;
    $('credit').className = 'pill ' + (c.scale_down_due ? 'warn' : '');
    $('credit').title = c.notes || '';
  } else {
    $('credit').textContent = 'no credit calendar';
    $('credit').className = 'pill';
  }
  const down = (snap.nodes||[]).filter(n => !n.healthy).length;
  const syncBad = (snap.nodes||[]).filter(n => n.healthy && !n.sync_ok).length;
  const idxBad = (snap.nodes||[]).filter(n => n.healthy && !n.index_ok).length;
  const pending = (snap.nodes||[]).filter(n => (n.index_pending_repos||[]).length).length;
  const ghost = (snap.nodes||[]).filter(n => (n.unreachable_peers||[]).length).length;
  const warns = snap.warnings || [];
  $('banner').innerHTML = `${pill(down===0, down===0?'All up':down+' down')}
    ${pill(syncBad===0, syncBad===0?'tips sync':'tips drift '+syncBad)}
    ${pill(idxBad===0, idxBad===0?'indexes ok':'index stale '+idxBad)}
    ${pending ? pill(false, 'warming '+pending, 'warn') : ''}
    ${ghost ? pill(false, 'ghost peers '+ghost, 'warn') : ''}
    <span class="muted">ingress ${snap.ingress?.fqdn||'—'} ${(snap.ingress?.dns||[]).join(' ')}</span>
    ${warns.length ? `<ul class="warn-list">${warns.map(w => `<li>${w}</li>`).join('')}</ul>` : ''}
    ${snap.last_error ? `<div class="err">${snap.last_error}</div>` : ''}`;

  const jobList = (snap.jobs && snap.jobs.length) ? snap.jobs : (snap.job ? [snap.job] : []);
  const runningFor = (fqdn) => jobList.some(j => j.running && j.target === fqdn);

  $('nodes').innerHTML = (snap.nodes||[]).map(n => {
    const va = n.visible_actions || {};
    const role = n.role || '';
    const busy = runningFor(n.fqdn);
    const acts = [];
    if (va.sync) {
      const pub = (snap.nodes||[]).find(x => (x.role||'').toLowerCase()==='publisher');
      const peer = (pub && pub.fqdn !== n.fqdn) ? pub.fqdn : null;
      acts.push(btn(busy ? 'Syncing…' : 'Synchronize', () => job('sync', n.fqdn, peer), busy));
    }
    if (va['index-warm']) acts.push(btn('Warm indexes', () => job('index-warm', n.fqdn), busy));
    if (va['point-dns'] && n.dns?.[0]) acts.push(btn('Point DNS', () => pointDns(n.fqdn, n.dns[0]), busy));
    if (va.repair) acts.push(btn('Repair/update', () => job('update', n.fqdn), busy));
    if (va['fix-repo-ownership']) acts.push(btn('Fix ownership', () => job('fix-repo-ownership', n.fqdn), busy));
    const rec = n.recommendation?.message || '';
    const pendingRepos = (n.index_pending_repos||[]).join(', ');
    const idxErr = (n.index_errors||[]).join('; ');
    const peers = (n.configured_peers||[]).join(', ');
    const badPeers = (n.unreachable_peers||[]).join(', ');
    return `<div class="card">
      <div class="row">
        <strong>${n.fqdn}</strong>
        ${pill(n.healthy, n.healthy?'up':'down')}
        ${role ? `<span class="pill">${role}${n.fleet_dns?' · fleetDns':''}</span>` : ''}
        ${pill(n.sync_ok, n.sync_ok?'sync':'out of sync')}
        ${pill(n.index_ok, n.index_ok?'index':'index stale')}
        ${pendingRepos ? pill(false, 'warming', 'warn') : ''}
        ${busy ? pill(false, 'job running', 'warn') : ''}
      </div>
      <div class="muted">DNS ${(n.dns||[]).join(', ')||'—'} · 443 ${n.tcp443?'open':'closed'} · git ${n.tcp_git?'open':'closed'}</div>
      ${peers ? `<div class="muted">peers ${peers}${badPeers ? ` · unreachable ${badPeers}` : ''}</div>` : ''}
      ${pendingRepos ? `<div class="muted">index pending: ${pendingRepos}</div>` : ''}
      ${idxErr ? `<div class="err">index error: ${idxErr}</div>` : ''}
      ${rec ? `<div style="margin-top:6px">${rec}</div>` : ''}
      <div class="actions">${acts.join('') || '<span class="muted">No actions</span>'}</div>
    </div>`;
  }).join('');

  if (!jobList.length) {
    $('job').textContent = '—';
  } else {
    $('job').textContent = jobList.map(j => {
      const st = j.running ? 'RUNNING' : (j.ok ? 'OK' : 'FAIL');
      const body = (j.log || '').trim();
      return `#${j.id} ${j.kind} ${j.target} ${st}${body ? '\n' + body : ''}`;
    }).join('\n\n');
  }
}

function btn(label, fn, disabled) {
  const id = 'b'+Math.random().toString(36).slice(2);
  queueMicrotask(() => {
    const el = $(id);
    if (!el) return;
    if (disabled) { el.disabled = true; return; }
    el.onclick = fn;
  });
  return `<button id="${id}"${disabled ? ' disabled' : ''}>${label}</button>`;
}

async function load() {
  snap = await api('/api/snapshot');
  render();
}

async function job(kind, fqdn, peer) {
  try {
    const body = { kind, fqdn };
    if (peer) body.peer = peer;
    await api('/api/job', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    await load();
  } catch (e) { alert(e.message); }
}

async function pointDns(fqdn, ip) {
  try {
    await api('/api/point-dns', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ fqdn, ip }) });
    await load();
  } catch (e) { alert(e.message); }
}

$('refresh').onclick = async () => { await api('/api/refresh', { method:'POST' }); await load(); };
$('warmAll').onclick = () => job('index-warm', null);
$('fleetDns').onclick = () => job('fleet-dns', null);
$('knownHosts').onclick = async () => {
  try {
    await api('/api/known-hosts-reset', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ fqdn: '' }) });
    await load();
  } catch (e) { alert(e.message); }
};

load();
setInterval(load, 8000);
</script>
</body>
</html>

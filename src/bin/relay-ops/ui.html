<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay Fleet</title>
<link rel="icon" href="/favicon.png">
<style>
  :root { --bg:#0f1419; --fg:#e7ecf1; --muted:#8b98a5; --ok:#3dd68c; --bad:#f07178; --warn:#e6c07b; --card:#1a2332; --line:#2a3544; --accent:#59c2ff; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line); }
  h1 { font-size:1.1rem; margin:0; font-weight:600; letter-spacing:.02em; }
  h2 { font-size:0.95rem; margin:0 0 8px; font-weight:600; }
  .muted { color:var(--muted); }
  button, .btn { background:#243044; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  button.on { border-color:var(--accent); background:#1b3a55; }
  main { padding:16px 20px 48px; display:grid; gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .pill { font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .pill.ok { color:var(--ok); border-color:#2a5; }
  .pill.bad { color:var(--bad); border-color:#a44; }
  .pill.warn { color:var(--warn); border-color:#a80; }
  .actions { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  pre { white-space:pre-wrap; background:#0b1016; border:1px solid var(--line); padding:10px; border-radius:8px; max-height:240px; overflow:auto; font-size:12px; }
  pre.mail-body { max-height:min(60vh, 520px); }
  .err { color:var(--bad); }
  .warn-list { margin:8px 0 0; padding-left:18px; color:var(--warn); }
  .warn-list li { margin:4px 0; }
  .panel { display:none; }
  .panel.on { display:grid; gap:12px; }
  .mail-cols { display:grid; gap:12px; grid-template-columns: minmax(240px, 1fr) minmax(280px, 2fr); }
  @media (max-width: 800px) { .mail-cols { grid-template-columns: 1fr; } }
  .list { max-height:min(65vh, 520px); overflow:auto; font-size:13px; }
  .list .mail-item { padding:8px 10px; border-radius:6px; cursor:pointer; border:1px solid transparent; margin-bottom:4px; }
  .list .mail-item:hover, .list .mail-item.on { background:#0b1016; border-color:var(--line); }
  .list .mail-item.unread strong { color:var(--fg); }
  .banner { background:#3d2a12; border:1px solid #6b3a12; border-radius:8px; padding:8px 10px; margin-top:8px; color:var(--warn); }
  code { font-size:12px; }
  .nav-badge { display:inline-block; min-width:1.25em; margin-left:6px; padding:0 6px; border-radius:999px; background:#6b3a12; color:var(--warn); font-size:11px; font-weight:650; }
  .nav-badge.empty { display:none; }
  .filter-chip.on { border-color:var(--accent); background:#1b3a55; }
  .autosync { margin-top:8px; padding:8px 10px; border-radius:8px; border:1px solid #6b3a12; background:#2a1c0e; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .autosync.stopped { border-color:#a44; background:#2a1518; }
  .autosync .countdown { font-variant-numeric: tabular-nums; font-weight:650; color:var(--warn); }
  #autoSyncLog { max-height:140px; }
</style>
</head>
<body>
<header>
  <h1>Relay Fleet</h1>
  <span id="mode" class="pill">…</span>
  <span id="credit" class="pill">…</span>
  <span id="topo" class="muted"></span>
  <div class="row" style="margin-left:12px">
    <button type="button" class="on" id="navFleet">Fleet</button>
    <button type="button" id="navInbox">Inbox<span id="inboxBadge" class="nav-badge empty">0</span></button>
  </div>
  <div class="row" style="margin-left:auto">
    <button id="refresh">Refresh</button>
    <button id="warmAll">Warm indexes</button>
    <button id="fleetDns">Fleet DNS</button>
    <button id="knownHosts">Reset known_hosts</button>
  </div>
</header>
<main>
  <div id="panelFleet" class="panel on">
    <div id="banner" class="card muted">Loading…</div>
    <div id="nodes"></div>
    <div class="card">
      <div class="muted">Auto-sync log</div>
      <pre id="autoSyncLog">—</pre>
    </div>
    <div class="card">
      <div class="muted">Job log</div>
      <pre id="job">—</pre>
    </div>
  </div>

  <div id="panelInbox" class="panel">
    <div class="card">
      <div class="row">
        <h2 style="margin:0">Inbox</h2>
        <span id="mailMeta" class="muted">Inbound Maildir (single MX host)</span>
      </div>
      <p class="muted" style="margin:6px 0 10px;font-size:13px">
        Receive-only OpenSMTPD catch-all on <strong>pub1</strong>. Opening a message moves it
        <code>new/</code> → <code>cur/</code>. Filter by unread status or recipient domain (“box”).
      </p>
      <div class="actions" style="margin-top:0">
        <button type="button" id="btnMailRefresh">Refresh</button>
        <button type="button" id="btnMailRead" disabled title="Already applied on open; use if list is stale">Mark read</button>
        <span class="muted" style="margin-left:4px">Status</span>
        <button type="button" class="filter-chip on" data-filter="all" id="filtAll">All</button>
        <button type="button" class="filter-chip" data-filter="unread" id="filtUnread">Unread</button>
        <button type="button" class="filter-chip" data-filter="read" id="filtRead">Read</button>
      </div>
      <div class="actions" id="mailBoxes" style="margin-top:8px"></div>
      <div id="mailErr" class="banner" style="display:none"></div>
      <div class="mail-cols" style="margin-top:12px">
        <div>
          <h2>Messages <span id="mailCount" class="muted"></span></h2>
          <div id="mailList" class="list"></div>
        </div>
        <div>
          <h2 id="mailSubject">Select a message</h2>
          <div id="mailHdr" class="muted" style="font-size:13px;margin-bottom:8px"></div>
          <pre id="mailBody" class="mail-body">—</pre>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let snap = null;
let activePanel = 'fleet';

/** Auto-sync: 30s countdown → sync job; cancelable; max 3 fails then stop (anti-loop). */
const AUTO_SYNC_SECS = 30;
const AUTO_SYNC_MAX_FAILS = 3;
/** @type {Record<string, {deadline:number|null, fails:number, givenUp:boolean, cancelled:boolean, inFlight:boolean, lastJobId:number|null, awaitingResult:boolean, pendingProbe:boolean, deferProbeEval:boolean}>} */
const autoSyncState = Object.create(null);
const autoSyncLogLines = [];
let autoSyncProbing = false;

async function api(path, opts) {
  const r = await fetch(path, opts);
  const t = await r.text();
  if (!r.ok) throw new Error(t || r.statusText);
  try { return JSON.parse(t); } catch { return t; }
}

function pill(ok, label, kind) {
  const cls = kind || (ok ? 'ok' : 'bad');
  return `<span class="pill ${cls}">${label}</span>`;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}

function showPanel(name) {
  activePanel = name;
  $('panelFleet').classList.toggle('on', name === 'fleet');
  $('panelInbox').classList.toggle('on', name === 'inbox');
  $('navFleet').classList.toggle('on', name === 'fleet');
  $('navInbox').classList.toggle('on', name === 'inbox');
  if (name === 'inbox') mailRefresh();
}

function setInboxBadge(n) {
  const el = $('inboxBadge');
  if (!el) return;
  const count = Number(n) || 0;
  el.textContent = String(count);
  el.classList.toggle('empty', count <= 0);
  el.title = count ? (count + ' unread') : '';
}

function autoSyncLog(msg) {
  const ts = new Date().toISOString().slice(11, 19);
  autoSyncLogLines.unshift(`[${ts}] ${msg}`);
  if (autoSyncLogLines.length > 40) autoSyncLogLines.length = 40;
  const el = $('autoSyncLog');
  if (el) el.textContent = autoSyncLogLines.join('\n') || '—';
}

function autoSyncEnsure(fqdn) {
  if (!autoSyncState[fqdn]) {
    autoSyncState[fqdn] = {
      deadline: null,
      fails: 0,
      givenUp: false,
      cancelled: false,
      inFlight: false,
      lastJobId: null,
      awaitingResult: false,
      pendingProbe: false,
      deferProbeEval: false,
    };
  }
  return autoSyncState[fqdn];
}

function publisherPeer(forFqdn) {
  const pub = (snap?.nodes || []).find(x => (x.role || '').toLowerCase() === 'publisher');
  if (pub && pub.fqdn !== forFqdn) return pub.fqdn;
  return null;
}

function jobListFromSnap() {
  return (snap?.jobs && snap.jobs.length) ? snap.jobs : (snap?.job ? [snap.job] : []);
}

function runningFor(fqdn) {
  return jobListFromSnap().some(j => j.running && j.target === fqdn);
}

function autoSyncSecsLeft(st) {
  if (!st.deadline) return null;
  return Math.max(0, Math.ceil((st.deadline - Date.now()) / 1000));
}

function autoSyncBannerHtml(fqdn) {
  const st = autoSyncEnsure(fqdn);
  const idBase = 'as_' + fqdn.replace(/[^a-z0-9]/gi, '_');
  if (st.givenUp) {
    return `<div class="autosync stopped" id="${idBase}">
      <span class="err">Auto-sync stopped after ${AUTO_SYNC_MAX_FAILS} failed attempts</span>
      <button type="button" data-as="reset" data-fqdn="${esc(fqdn)}">Reset auto-sync</button>
      <button type="button" data-as="now" data-fqdn="${esc(fqdn)}">Sync now</button>
    </div>`;
  }
  if (st.cancelled) {
    return `<div class="autosync" id="${idBase}">
      <span class="muted">Auto-sync cancelled</span>
      <button type="button" data-as="resume" data-fqdn="${esc(fqdn)}">Resume (30s)</button>
      <button type="button" data-as="now" data-fqdn="${esc(fqdn)}">Sync now</button>
    </div>`;
  }
  if (st.inFlight || st.awaitingResult) {
    return `<div class="autosync" id="${idBase}">
      <span class="countdown">Synchronizing…</span>
      <span class="muted">attempt ${st.fails + 1}/${AUTO_SYNC_MAX_FAILS}</span>
    </div>`;
  }
  const left = autoSyncSecsLeft(st);
  if (left !== null) {
    return `<div class="autosync" id="${idBase}">
      <span class="countdown">Synchronizing in ${left}s</span>
      <button type="button" data-as="cancel" data-fqdn="${esc(fqdn)}">Cancel</button>
      <button type="button" data-as="now" data-fqdn="${esc(fqdn)}">Sync now</button>
      <span class="muted">fails ${st.fails}/${AUTO_SYNC_MAX_FAILS}</span>
    </div>`;
  }
  return '';
}

function bindAutoSyncButtons(root) {
  root.querySelectorAll('[data-as]').forEach(el => {
    el.onclick = () => {
      const fqdn = el.dataset.fqdn;
      const act = el.dataset.as;
      const st = autoSyncEnsure(fqdn);
      if (act === 'cancel') {
        st.deadline = null;
        st.cancelled = true;
        autoSyncLog(`${fqdn}: countdown cancelled`);
        render();
      } else if (act === 'resume') {
        st.cancelled = false;
        st.givenUp = false;
        st.deadline = Date.now() + AUTO_SYNC_SECS * 1000;
        autoSyncLog(`${fqdn}: countdown resumed (${AUTO_SYNC_SECS}s)`);
        render();
      } else if (act === 'reset') {
        st.fails = 0;
        st.givenUp = false;
        st.cancelled = false;
        st.deadline = Date.now() + AUTO_SYNC_SECS * 1000;
        autoSyncLog(`${fqdn}: auto-sync reset; countdown ${AUTO_SYNC_SECS}s`);
        render();
      } else if (act === 'now') {
        st.cancelled = false;
        st.deadline = null;
        void autoSyncFire(fqdn);
      }
    };
  });
}

async function autoSyncFire(fqdn) {
  const st = autoSyncEnsure(fqdn);
  if (st.inFlight || st.givenUp) return;
  if (runningFor(fqdn)) {
    autoSyncLog(`${fqdn}: skip fire — job already running`);
    return;
  }
  st.inFlight = true;
  st.deadline = null;
  st.awaitingResult = true;
  render();
  const peer = publisherPeer(fqdn);
  autoSyncLog(`${fqdn}: starting sync` + (peer ? ` (peer ${peer})` : ''));
  try {
    const body = { kind: 'sync', fqdn };
    if (peer) body.peer = peer;
    const text = await api('/api/job', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    // "job N started"
    const m = String(text).match(/job\s+(\d+)/i);
    st.lastJobId = m ? Number(m[1]) : null;
    autoSyncLog(`${fqdn}: job ${st.lastJobId ?? '?'} accepted`);
  } catch (e) {
    st.inFlight = false;
    st.awaitingResult = false;
    st.fails += 1;
    autoSyncLog(`${fqdn}: sync start FAILED (${e.message || e}) [${st.fails}/${AUTO_SYNC_MAX_FAILS}]`);
    if (st.fails >= AUTO_SYNC_MAX_FAILS) {
      st.givenUp = true;
      autoSyncLog(`${fqdn}: giving up after ${st.fails} failures`);
    } else {
      st.deadline = Date.now() + AUTO_SYNC_SECS * 1000;
      autoSyncLog(`${fqdn}: retry countdown ${AUTO_SYNC_SECS}s`);
    }
  }
  await load();
}

/** After snapshot: clear healthy nodes; start countdowns; observe finished jobs. */
function autoSyncReconcile() {
  if (!snap) return;
  const admin = !!(snap.inventory || {}).admin_ready;
  const jobs = jobListFromSnap();

  for (const n of snap.nodes || []) {
    const st = autoSyncEnsure(n.fqdn);
    const va = n.visible_actions || {};

    // Observe job completion for an in-flight auto-sync.
    if (st.awaitingResult && st.lastJobId != null) {
      const j = jobs.find(x => x.id === st.lastJobId);
      if (j && !j.running) {
        st.inFlight = false;
        st.awaitingResult = false;
        if (j.ok === false) {
          st.fails += 1;
          autoSyncLog(`${n.fqdn}: job #${j.id} FAILED [${st.fails}/${AUTO_SYNC_MAX_FAILS}]`);
          if (st.fails >= AUTO_SYNC_MAX_FAILS) {
            st.givenUp = true;
            st.deadline = null;
            autoSyncLog(`${n.fqdn}: giving up after ${st.fails} failures`);
          } else if (!st.cancelled) {
            st.deadline = Date.now() + AUTO_SYNC_SECS * 1000;
            autoSyncLog(`${n.fqdn}: retry countdown ${AUTO_SYNC_SECS}s`);
          }
        } else if (j.ok === true) {
          st.pendingProbe = true;
          st.deferProbeEval = true; // evaluate after next refresh load, not this pass
          autoSyncLog(`${n.fqdn}: job #${j.id} OK — refreshing tip probe`);
        }
      }
    } else if (st.awaitingResult && st.inFlight && !runningFor(n.fqdn)) {
      // Job id unknown but no longer running — re-probe path.
      st.inFlight = false;
      st.awaitingResult = false;
      st.pendingProbe = true;
      st.deferProbeEval = true;
    }

    if (n.healthy && n.sync_ok) {
      if (st.fails || st.givenUp) autoSyncLog(`${n.fqdn}: back in sync — clearing auto-sync state`);
      st.fails = 0;
      st.givenUp = false;
      st.cancelled = false;
      st.deadline = null;
      st.inFlight = false;
      st.awaitingResult = false;
      st.pendingProbe = false;
      st.deferProbeEval = false;
      st.lastJobId = null;
      continue;
    }

    // After a successful job + tip refresh, still drifting → failed attempt (anti-loop).
    if (st.pendingProbe && !st.deferProbeEval && !st.inFlight && !st.awaitingResult
        && n.healthy && !n.sync_ok && va.sync && !st.givenUp && !st.cancelled) {
      st.pendingProbe = false;
      st.lastJobId = null;
      st.fails += 1;
      autoSyncLog(`${n.fqdn}: still out of sync after sync job [${st.fails}/${AUTO_SYNC_MAX_FAILS}]`);
      if (st.fails >= AUTO_SYNC_MAX_FAILS) {
        st.givenUp = true;
        st.deadline = null;
        autoSyncLog(`${n.fqdn}: giving up after ${st.fails} failures`);
      } else {
        st.deadline = Date.now() + AUTO_SYNC_SECS * 1000;
        autoSyncLog(`${n.fqdn}: retry countdown ${AUTO_SYNC_SECS}s`);
      }
    }

    const needs = admin && n.healthy && !n.sync_ok && va.sync
      && !st.givenUp && !st.cancelled && !st.inFlight && !st.awaitingResult && !st.pendingProbe
      && !runningFor(n.fqdn);
    if (needs && st.deadline == null) {
      st.deadline = Date.now() + AUTO_SYNC_SECS * 1000;
      autoSyncLog(`${n.fqdn}: out of sync — synchronizing in ${AUTO_SYNC_SECS}s (cancel to stop)`);
    }
  }
}

function autoSyncTick() {
  let fired = false;
  let needRender = false;
  for (const [fqdn, st] of Object.entries(autoSyncState)) {
    if (st.deadline == null || st.cancelled || st.givenUp || st.inFlight) continue;
    const left = autoSyncSecsLeft(st);
    needRender = true;
    if (left === 0) {
      st.deadline = null;
      fired = true;
      void autoSyncFire(fqdn);
    }
  }
  if (needRender && !fired && activePanel === 'fleet') {
    // Update countdown labels without full card rebuild when possible.
    for (const [fqdn, st] of Object.entries(autoSyncState)) {
      const left = autoSyncSecsLeft(st);
      if (left === null) continue;
      const idBase = 'as_' + fqdn.replace(/[^a-z0-9]/gi, '_');
      const el = document.getElementById(idBase);
      const cd = el && el.querySelector('.countdown');
      if (cd) cd.textContent = `Synchronizing in ${left}s`;
    }
  }
}

function render() {
  if (!snap) return;
  const inv = snap.inventory || {};
  $('mode').textContent = inv.admin_ready ? 'Admin' : 'Observer';
  $('mode').className = 'pill ' + (inv.admin_ready ? 'ok' : '');
  $('topo').textContent = (snap.topology_source || '') + ' · ' + (snap.gitlab_url || '');
  const c = snap.credit;
  if (c) {
    const d = c.days_to_scale_down_target;
    const label = c.scale_down_due
      ? `Credit scale-down due · ${d.toFixed(1)}d`
      : `${c.promo} · ${d.toFixed(1)}d to scale-down · $${c.credit_usd}`;
    $('credit').textContent = label;
    $('credit').className = 'pill ' + (c.scale_down_due ? 'warn' : '');
    $('credit').title = c.notes || '';
  } else {
    $('credit').textContent = 'no credit calendar';
    $('credit').className = 'pill';
  }
  const down = (snap.nodes||[]).filter(n => !n.healthy).length;
  const syncBad = (snap.nodes||[]).filter(n => n.healthy && !n.sync_ok).length;
  const idxBad = (snap.nodes||[]).filter(n => n.healthy && !n.index_ok).length;
  const pending = (snap.nodes||[]).filter(n => (n.index_pending_repos||[]).length).length;
  const ghost = (snap.nodes||[]).filter(n => (n.unreachable_peers||[]).length).length;
  const warns = snap.warnings || [];
  $('banner').innerHTML = `${pill(down===0, down===0?'All up':down+' down')}
    ${pill(syncBad===0, syncBad===0?'tips sync':'tips drift '+syncBad)}
    ${pill(idxBad===0, idxBad===0?'indexes ok':'index stale '+idxBad)}
    ${pending ? pill(false, 'warming '+pending, 'warn') : ''}
    ${ghost ? pill(false, 'ghost peers '+ghost, 'warn') : ''}
    <span class="muted">ingress ${snap.ingress?.fqdn||'—'} ${(snap.ingress?.dns||[]).join(' ')}</span>
    ${warns.length ? `<ul class="warn-list">${warns.map(w => `<li>${w}</li>`).join('')}</ul>` : ''}
    ${snap.last_error ? `<div class="err">${snap.last_error}</div>` : ''}`;

  const jobs = jobListFromSnap();

  $('nodes').innerHTML = (snap.nodes||[]).map(n => {
    const va = n.visible_actions || {};
    const role = n.role || '';
    const busy = runningFor(n.fqdn);
    const peer = publisherPeer(n.fqdn);
    const acts = [];
    if (va.sync) {
      acts.push(btn(busy ? 'Syncing…' : 'Synchronize', () => job('sync', n.fqdn, peer), busy));
    }
    if (va['index-warm']) acts.push(btn('Warm indexes', () => job('index-warm', n.fqdn), busy));
    if (va['point-dns'] && n.dns?.[0]) acts.push(btn('Point DNS', () => pointDns(n.fqdn, n.dns[0]), busy));
    if (va.repair) acts.push(btn('Repair/update', () => job('update', n.fqdn), busy));
    if (va['fix-repo-ownership']) acts.push(btn('Fix ownership', () => job('fix-repo-ownership', n.fqdn), busy));
    const rec = n.recommendation?.message || '';
    const pendingRepos = (n.index_pending_repos||[]).join(', ');
    const idxErr = (n.index_errors||[]).join('; ');
    const peers = (n.configured_peers||[]).join(', ');
    const badPeers = (n.unreachable_peers||[]).join(', ');
    const asHtml = (va.sync && !n.sync_ok && n.healthy) ? autoSyncBannerHtml(n.fqdn) : '';
    return `<div class="card">
      <div class="row">
        <strong>${n.fqdn}</strong>
        ${pill(n.healthy, n.healthy?'up':'down')}
        ${role ? `<span class="pill">${role}${n.fleet_dns?' · fleetDns':''}</span>` : ''}
        ${pill(n.sync_ok, n.sync_ok?'sync':'out of sync')}
        ${pill(n.index_ok, n.index_ok?'index':'index stale')}
        ${pendingRepos ? pill(false, 'warming', 'warn') : ''}
        ${busy ? pill(false, 'job running', 'warn') : ''}
      </div>
      <div class="muted">DNS ${(n.dns||[]).join(', ')||'—'} · 443 ${n.tcp443?'open':'closed'} · git ${n.tcp_git?'open':'closed'}</div>
      ${peers ? `<div class="muted">peers ${peers}${badPeers ? ` · unreachable ${badPeers}` : ''}</div>` : ''}
      ${pendingRepos ? `<div class="muted">index pending: ${pendingRepos}</div>` : ''}
      ${idxErr ? `<div class="err">index error: ${idxErr}</div>` : ''}
      ${rec ? `<div style="margin-top:6px">${rec}</div>` : ''}
      ${asHtml}
      <div class="actions">${acts.join('') || '<span class="muted">No actions</span>'}</div>
    </div>`;
  }).join('');

  bindAutoSyncButtons($('nodes'));

  const logEl = $('autoSyncLog');
  if (logEl) logEl.textContent = autoSyncLogLines.join('\n') || '—';

  if (!jobs.length) {
    $('job').textContent = '—';
  } else {
    $('job').textContent = jobs.map(j => {
      const st = j.running ? 'RUNNING' : (j.ok ? 'OK' : 'FAIL');
      const body = (j.log || '').trim();
      return `#${j.id} ${j.kind} ${j.target} ${st}${body ? '\n' + body : ''}`;
    }).join('\n\n');
  }
}

function btn(label, fn, disabled) {
  const id = 'b'+Math.random().toString(36).slice(2);
  queueMicrotask(() => {
    const el = $(id);
    if (!el) return;
    if (disabled) { el.disabled = true; return; }
    el.onclick = fn;
  });
  return `<button id="${id}"${disabled ? ' disabled' : ''}>${label}</button>`;
}

async function load() {
  // If any auto-sync is waiting on a fresh tip probe, refresh first (once),
  // then arm probe evaluation for this reconcile pass.
  const wantsProbe = Object.values(autoSyncState).some(s => s.pendingProbe && s.deferProbeEval);
  if (wantsProbe && !autoSyncProbing) {
    autoSyncProbing = true;
    try { await api('/api/refresh', { method: 'POST' }); }
    catch (_) { /* snapshot may still be stale; failure counted below */ }
    for (const s of Object.values(autoSyncState)) {
      if (s.pendingProbe) s.deferProbeEval = false;
    }
    autoSyncProbing = false;
  }
  snap = await api('/api/snapshot');
  autoSyncReconcile();
  render();
  // Job just finished OK → schedule an immediate follow-up load for tip probe.
  if (Object.values(autoSyncState).some(s => s.pendingProbe && s.deferProbeEval)) {
    setTimeout(() => { void load(); }, 1500);
  }
}

async function job(kind, fqdn, peer) {
  try {
    const body = { kind, fqdn };
    if (peer) body.peer = peer;
    await api('/api/job', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    await load();
  } catch (e) { alert(e.message); }
}

async function pointDns(fqdn, ip) {
  try {
    await api('/api/point-dns', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ fqdn, ip }) });
    await load();
  } catch (e) { alert(e.message); }
}

const mailState = {
  messages: [],
  selected: null,
  filter: 'all',   // all | unread | read
  box: 'all',      // all | domain
  host: '',
  maildir: '',
};

function recipientDomain(to) {
  const s = String(to || '');
  const m = s.match(/@([A-Za-z0-9.-]+\.[A-Za-z]{2,})/);
  return m ? m[1].toLowerCase() : '(other)';
}

function mailShowErr(msg) {
  const el = $('mailErr');
  if (!msg) { el.style.display = 'none'; el.textContent = ''; return; }
  el.style.display = 'block';
  el.textContent = msg;
}

function mailFiltered() {
  return mailState.messages.filter(m => {
    if (mailState.filter === 'unread' && !m.unread) return false;
    if (mailState.filter === 'read' && m.unread) return false;
    if (mailState.box !== 'all' && recipientDomain(m.to) !== mailState.box) return false;
    return true;
  });
}

function mailRenderBoxes() {
  const counts = new Map();
  for (const m of mailState.messages) {
    const d = recipientDomain(m.to);
    const cur = counts.get(d) || { total: 0, unread: 0 };
    cur.total += 1;
    if (m.unread) cur.unread += 1;
    counts.set(d, cur);
  }
  const domains = [...counts.keys()].sort();
  const chips = [
    { id: 'all', label: 'All boxes', total: mailState.messages.length,
      unread: mailState.messages.filter(m => m.unread).length },
    ...domains.map(d => ({ id: d, label: d, ...counts.get(d) })),
  ];
  $('mailBoxes').innerHTML = chips.map(c => {
    const on = mailState.box === c.id ? ' on filter-chip' : ' filter-chip';
    const badge = c.unread ? ` <span class="pill warn">${c.unread}</span>` : '';
    return `<button type="button" class="${on.trim()}" data-box="${esc(c.id)}">${esc(c.label)}${badge}</button>`;
  }).join('');
  $('mailBoxes').querySelectorAll('[data-box]').forEach(el => {
    el.onclick = () => {
      mailState.box = el.dataset.box;
      mailRenderBoxes();
      mailRenderList();
    };
  });
}

function mailUpdateFilterChips() {
  for (const id of ['filtAll', 'filtUnread', 'filtRead']) {
    const el = $(id);
    if (!el) continue;
    el.classList.toggle('on', el.dataset.filter === mailState.filter);
  }
}

async function mailRefresh() {
  mailShowErr('');
  $('mailList').innerHTML = '<div class="muted">Loading…</div>';
  try {
    const j = await api('/api/mail/list');
    mailState.messages = j.messages || [];
    mailState.host = j.host || j.mx || '';
    mailState.maildir = j.maildir || '';
    const unread = mailState.messages.filter(m => m.unread).length;
    setInboxBadge(unread);
    $('mailMeta').textContent =
      'MX: ' + (mailState.host || '?') +
      (mailState.maildir ? ' · ' + mailState.maildir : '') +
      ' · ' + mailState.messages.length + ' msg · ' + unread + ' unread';
    mailUpdateFilterChips();
    mailRenderBoxes();
    mailRenderList();
    if (mailState.selected && !mailState.messages.some(m => m.id === mailState.selected)) {
      mailState.selected = null;
      $('btnMailRead').disabled = true;
      $('mailSubject').textContent = 'Select a message';
      $('mailHdr').textContent = '';
      $('mailBody').textContent = '—';
    }
  } catch (e) {
    $('mailList').innerHTML = '';
    mailShowErr(String(e.message || e));
  }
}

/** Lightweight badge poll (SSH to MX) — not every fleet snapshot tick. */
async function mailBadgeOnly() {
  if (activePanel === 'inbox') return; // full refresh owns the list there
  try {
    const j = await api('/api/mail/list');
    const unread = (j.messages || []).filter(m => m.unread).length;
    setInboxBadge(unread);
  } catch (_) { /* keep last badge */ }
}

function mailRenderList() {
  const box = $('mailList');
  const items = mailFiltered();
  $('mailCount').textContent = items.length !== mailState.messages.length
    ? `(${items.length} of ${mailState.messages.length})`
    : `(${items.length})`;
  if (!items.length) {
    box.innerHTML = '<div class="muted">No messages in this filter</div>';
    return;
  }
  box.innerHTML = items.map(m => {
    const on = mailState.selected === m.id ? ' on' : '';
    const unreadCls = m.unread ? ' unread' : '';
    const badge = m.unread ? '<span class="pill warn">new</span> ' : '';
    const dom = recipientDomain(m.to);
    return `<div class="mail-item${on}${unreadCls}" data-id="${esc(m.id)}">` +
      `${badge}<strong>${esc(m.subject || '(no subject)')}</strong><br/>` +
      `<span class="muted">${esc(m.from)} → ${esc(m.to)}</span><br/>` +
      `<span class="muted">${esc(dom)} · ${esc(m.folder || '')}${m.date ? ' · ' + esc(m.date) : ''}</span></div>`;
  }).join('');
  box.querySelectorAll('[data-id]').forEach(el => {
    el.onclick = () => mailOpen(el.dataset.id);
  });
}

function mailApplyReadLocal(id) {
  const m = mailState.messages.find(x => x.id === id);
  if (m) {
    m.unread = false;
    m.folder = 'cur';
  }
  setInboxBadge(mailState.messages.filter(x => x.unread).length);
  mailRenderBoxes();
  mailRenderList();
  $('btnMailRead').disabled = true;
}

async function mailOpen(id) {
  mailState.selected = id;
  mailRenderList();
  const wasUnread = !!(mailState.messages.find(m => m.id === id) || {}).unread;
  $('btnMailRead').disabled = !wasUnread;
  $('mailBody').textContent = 'Loading…';
  mailShowErr('');
  try {
    // GET /api/mail/message marks unread (new/) as read on the MX host.
    const j = await api('/api/mail/message?id=' + encodeURIComponent(id));
    $('mailSubject').textContent = j.subject || '(no subject)';
    $('mailHdr').textContent =
      (j.from || '') + ' → ' + (j.to || '') + (j.date ? ' · ' + j.date : '');
    $('mailBody').textContent = j.body || '(empty body)';
    mailApplyReadLocal(id);
  } catch (e) {
    $('mailBody').textContent = String(e.message || e);
  }
}

async function mailMarkRead() {
  if (!mailState.selected) return;
  try {
    await api('/api/mail/mark-read', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: mailState.selected }),
    });
    mailApplyReadLocal(mailState.selected);
  } catch (e) {
    mailShowErr(String(e.message || e));
  }
}

$('navFleet').onclick = () => showPanel('fleet');
$('navInbox').onclick = () => showPanel('inbox');
$('btnMailRefresh').onclick = () => mailRefresh();
$('btnMailRead').onclick = () => mailMarkRead();
for (const id of ['filtAll', 'filtUnread', 'filtRead']) {
  $(id).onclick = () => {
    mailState.filter = $(id).dataset.filter;
    mailUpdateFilterChips();
    mailRenderList();
  };
}

$('refresh').onclick = async () => { await api('/api/refresh', { method:'POST' }); await load(); };
$('warmAll').onclick = () => job('index-warm', null);
$('fleetDns').onclick = () => job('fleet-dns', null);
$('knownHosts').onclick = async () => {
  try {
    await api('/api/known-hosts-reset', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ fqdn: '' }) });
    await load();
  } catch (e) { alert(e.message); }
};

load();
mailBadgeOnly();
setInterval(load, 8000);
setInterval(mailBadgeOnly, 60000);
setInterval(autoSyncTick, 1000);
</script>

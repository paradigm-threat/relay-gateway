# relay-gateway — GitLab CI (clevertree/relay-server at repo root)
# Setup: docs/GITLAB_CI_SETUP.md

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  RUST_VERSION: "1.91"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-cache"
  DOCKER_IMAGE: "${CI_REGISTRY_IMAGE}/relay-gateway"
  DOCKERFILE: "Dockerfile.production"

stages:
  - test
  - package
  - docker

cache:
  key: "${CI_COMMIT_REF_SLUG}-cargo-registry-v1"
  paths:
    - .cargo-cache/registry/
    - .cargo-cache/git/
    - target/

test:verify:
  stage: test
  image: rust:${RUST_VERSION}-bookworm
  timeout: 45m
  before_script:
    - export PATH="/usr/local/cargo/bin:$PATH"
    - apt-get update -qq && apt-get install -y -qq curl jq nodejs git rsync
    - chmod +x ./scripts/ci-ensure-deps.sh
    - ./scripts/ci-ensure-deps.sh
  script:
    - cargo test
    - cargo build --release

package:linode-tgz:
  stage: package
  needs: ["test:verify"]
  image: rust:${RUST_VERSION}-bookworm
  timeout: 45m
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - export PATH="/usr/local/cargo/bin:$PATH"
    - apt-get update -qq && apt-get install -y -qq git rsync
    - chmod +x ./scripts/ci-ensure-deps.sh
    - ./scripts/ci-ensure-deps.sh
  script:
    - cargo build --release
    - ./scripts/pack-linode-deploy.sh
  artifacts:
    name: "relay-linode-deploy-$CI_COMMIT_SHORT_SHA"
    paths:
      - target/relay-linode-deploy.tgz
    expire_in: 30 days

docker:prepare-context:
  stage: docker
  needs: ["test:verify"]
  image: rust:${RUST_VERSION}-bookworm
  timeout: 30m
  variables:
    RELAY_DOCKER_REGISTRY_DEPS: "1"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - export PATH="/usr/local/cargo/bin:$PATH"
    - apt-get update -qq && apt-get install -y -qq git rsync
  script:
    - ./scripts/stage-docker-context.sh "$CI_PROJECT_DIR/docker-ctx"
  artifacts:
    name: "relay-docker-ctx-$CI_COMMIT_SHORT_SHA"
    paths:
      - docker-ctx/
    expire_in: 1 hour

docker:publish:
  stage: docker
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  needs: ["docker:prepare-context"]
  timeout: 30m
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - |
      TAGS="--destination ${DOCKER_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        TAGS="$TAGS --destination ${DOCKER_IMAGE}:main --destination ${DOCKER_IMAGE}:latest"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="$TAGS --destination ${DOCKER_IMAGE}:${CI_COMMIT_TAG}"
      fi
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/docker-ctx" \
        --dockerfile "${CI_PROJECT_DIR}/${DOCKERFILE}" \
        --cache=true \
        --cache-repo "${CI_REGISTRY_IMAGE}/cache" \
        $TAGS

publish:crate:
  stage: package
  image: rust:${RUST_VERSION}-bookworm
  needs: ["test:verify"]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
      when: manual
  before_script:
    - export PATH="/usr/local/cargo/bin:$PATH"
    - chmod +x ./scripts/ci-ensure-deps.sh
    - ./scripts/ci-ensure-deps.sh
  script:
    - cargo publish --dry-run
  allow_failure: true

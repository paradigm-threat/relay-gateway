# relay-gateway — GitLab CI (replaces GitHub Actions for this repo)
# Lint this file via API: scripts/gitlab-ci-lint.sh (needs GITLAB_TOKEN + GITLAB_PROJECT_ID)
# Or: GitLab UI → Build → Pipeline editor → Validate

# Minimize shared-runner minutes: pipelines are ON-DEMAND only.
# Trigger a run manually with:
#   glab ci run -b main            # or any branch (uses API source)
#   GitLab UI → Build → Pipelines → Run pipeline (web source)
# Release tags (vX.Y.Z) still build + package automatically.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"        # "Run pipeline" button
    - if: $CI_PIPELINE_SOURCE == "api"        # glab ci run / REST API
    - if: $CI_PIPELINE_SOURCE == "trigger"    # trigger token
    - if: $CI_PIPELINE_SOURCE == "pipeline"   # multi-project / parent-child
    - if: $CI_COMMIT_TAG =~ /^v/              # release tags auto-run
    - when: never                             # branch pushes + MRs: no auto-run

variables:
  # Match monorepo toolchain (path-dep Cargo.lock expects a recent rustc).
  RUST_VERSION: "1.92"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-cache"
  RELAY_PATH_DEPS_REF: "main"

cache:
  key: "${CI_COMMIT_REF_SLUG}-cargo"
  paths:
    - .cargo-cache/registry/
    - .cargo-cache/git/
    - target/

stages:
  - test
  - package

# Unit tests + HTTP smoke for POST /api/config (no external services)
test:verify:
  stage: test
  image: rust:${RUST_VERSION}-bookworm
  before_script:
    - export PATH="/usr/local/cargo/bin:$PATH"
    - apt-get update -qq && apt-get install -y -qq curl jq nodejs git
    - node -v
    - rustc -Vv
    # Cargo.toml path deps: ../relay-runtime and ../../md2ast from $CI_PROJECT_DIR
    - |
      set -euo pipefail
      REF="${RELAY_PATH_DEPS_REF:-main}"
      RUNTIME_URL="${RELAY_RUNTIME_GIT_URL:-https://gitlab.com/clevertree/relay-runtime.git}"
      MD2AST_URL="${MD2AST_GIT_URL:-https://gitlab.com/clevertree/md2jsx.git}"
      mkdir -p "$CI_PROJECT_DIR/.." "$CI_PROJECT_DIR/../.."
      # relay-runtime path-deps themed-styler at ../relay-gateway/themed-styler
      # (GitLab project dir is relay-server).
      ln -sfn "$CI_PROJECT_DIR" "$CI_PROJECT_DIR/../relay-gateway"
      if [[ ! -f "$CI_PROJECT_DIR/../relay-runtime/Cargo.toml" ]]; then
        git clone --depth 1 --branch "$REF" "$RUNTIME_URL" "$CI_PROJECT_DIR/../relay-runtime"
      fi
      if [[ ! -f "$CI_PROJECT_DIR/../../md2ast/Cargo.toml" ]]; then
        git clone --depth 1 --branch "$REF" "$MD2AST_URL" "$CI_PROJECT_DIR/../../md2ast"
      fi
  script:
    - cargo test --locked
    - cargo build --release --locked
    - mkdir -p ci-data
    - |
      RELAY_REPO_PATH="$CI_PROJECT_DIR/ci-data" RELAY_BIND=127.0.0.1:18080 ./target/release/relay-gateway &
      RELAY_PID=$!
      for i in $(seq 1 30); do
        curl -sfS -X POST "http://127.0.0.1:18080/api/config" >/dev/null && break
        sleep 0.2
      done
      curl -sfS -X POST "http://127.0.0.1:18080/api/config" | jq -e 'type == "object"'
      kill $RELAY_PID
      wait $RELAY_PID 2>/dev/null || true

# Linode deploy tarball (same as scripts/pack-linode-deploy.sh); download from job artifacts
package:linode-tgz:
  stage: package
  needs: ["test:verify"]
  image: rust:${RUST_VERSION}-bookworm
  before_script:
    - export PATH="/usr/local/cargo/bin:$PATH"
    - apt-get update -qq && apt-get install -y -qq curl jq nodejs npm git pkg-config libssl-dev build-essential
    - rustc -Vv
    - |
      set -euo pipefail
      REF="${RELAY_PATH_DEPS_REF:-main}"
      RUNTIME_URL="${RELAY_RUNTIME_GIT_URL:-https://gitlab.com/clevertree/relay-runtime.git}"
      MD2AST_URL="${MD2AST_GIT_URL:-https://gitlab.com/clevertree/md2jsx.git}"
      WEB_URL="${RELAY_CLIENT_WEB_GIT_URL:-https://gitlab.com/clevertree/relay-client-web.git}"
      mkdir -p "$CI_PROJECT_DIR/.." "$CI_PROJECT_DIR/../.."
      ln -sfn "$CI_PROJECT_DIR" "$CI_PROJECT_DIR/../relay-gateway"
      if [[ ! -f "$CI_PROJECT_DIR/../relay-runtime/Cargo.toml" ]]; then
        git clone --depth 1 --branch "$REF" "$RUNTIME_URL" "$CI_PROJECT_DIR/../relay-runtime"
      fi
      if [[ ! -f "$CI_PROJECT_DIR/../../md2ast/Cargo.toml" ]]; then
        git clone --depth 1 --branch "$REF" "$MD2AST_URL" "$CI_PROJECT_DIR/../../md2ast"
      fi
      if [[ ! -f "$CI_PROJECT_DIR/../relay-client-web/package.json" ]]; then
        git clone --depth 1 --branch "$REF" "$WEB_URL" "$CI_PROJECT_DIR/../relay-client-web"
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    # Shallow clones have no upstream; allow pack without require_clean_pushed.
    - npm --prefix "$CI_PROJECT_DIR/../relay-client-web" ci
    - RELAY_PACK_ALLOW_DIRTY=1 ./scripts/pack-linode-deploy.sh
  artifacts:
    name: "relay-linode-deploy-$CI_COMMIT_SHORT_SHA"
    paths:
      - target/relay-linode-deploy.tgz
    expire_in: 30 days

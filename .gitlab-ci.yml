# relay-server — GitLab CI (replaces GitHub Actions for this repo)
# Lint this file via API: scripts/gitlab-ci-lint.sh (needs GITLAB_TOKEN + GITLAB_PROJECT_ID)
# Or: GitLab UI → Build → Pipeline editor → Validate

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  RUST_VERSION: "1.85"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-cache"

cache:
  key: "${CI_COMMIT_REF_SLUG}-cargo"
  paths:
    - .cargo-cache/registry/
    - .cargo-cache/git/
    - target/

stages:
  - test
  - package

# Unit tests + HTTP smoke for GET /api/config (no external services)
test:verify:
  stage: test
  image: rust:${RUST_VERSION}-bookworm
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl jq
    - rustc -Vv
  script:
    - cargo test --locked
    - cargo build --release --locked
    - mkdir -p ci-data
    - |
      RELAY_REPO_PATH="$CI_PROJECT_DIR/ci-data" RELAY_BIND=127.0.0.1:18080 ./target/release/relay-server &
      RELAY_PID=$!
      for i in $(seq 1 30); do
        curl -sfS "http://127.0.0.1:18080/api/config" >/dev/null && break
        sleep 0.2
      done
      curl -sfS "http://127.0.0.1:18080/api/config" | jq -e 'type == "object"'
      kill $RELAY_PID
      wait $RELAY_PID 2>/dev/null || true

# Linode deploy tarball (same as scripts/pack-linode-deploy.sh); download from job artifacts
package:linode-tgz:
  stage: package
  needs: ["test:verify"]
  image: rust:${RUST_VERSION}-bookworm
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - ./scripts/pack-linode-deploy.sh
  artifacts:
    name: "relay-linode-deploy-$CI_COMMIT_SHORT_SHA"
    paths:
      - target/relay-linode-deploy.tgz
    expire_in: 30 days

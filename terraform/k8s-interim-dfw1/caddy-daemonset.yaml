# Interim TLS terminator for dfw1 Spot K8s (until bare VM + install-caddy-tls).
# hostNetwork binds :80/:443 on the worker; forwards to relay on 127.0.0.1:8080.
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-relay-dfw1
data:
  Caddyfile: |
    {
      email hostmaster@relaygateway.net
      on_demand_tls {
        ask http://127.0.0.1:3999/allow
      }
    }
    :80 {
      reverse_proxy 127.0.0.1:8080
    }
    https:// {
      tls {
        on_demand
      }
      reverse_proxy 127.0.0.1:8080
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: caddy-relay
  labels:
    app: caddy-relay
spec:
  selector:
    matchLabels:
      app: caddy-relay
  template:
    metadata:
      labels:
        app: caddy-relay
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: prod-instance-17800849375542903
      tolerations:
        - operator: Exists
      containers:
        - name: caddy-ask
          image: python:3.12-alpine
          command: ["python3", "/scripts/caddy-ask.py"]
          env:
            - name: RELAY_NODE_FQDN
              value: dfw1.relaygateway.net
          ports:
            - containerPort: 3999
              hostPort: 3999
          volumeMounts:
            - name: ask-script
              mountPath: /scripts
        - name: caddy
          image: caddy:2.8-alpine
          ports:
            - containerPort: 80
              hostPort: 80
            - containerPort: 443
              hostPort: 443
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
      volumes:
        - name: ask-script
          configMap:
            name: caddy-relay-dfw1-ask
            defaultMode: 0555
        - name: caddyfile
          configMap:
            name: caddy-relay-dfw1
        - name: data
          emptyDir: {}
        - name: config
          emptyDir: {}

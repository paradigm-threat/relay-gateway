message: >-
  Node is down and Spot has no assigned IP for this cloudspace (missing pool,
  No Winning Bids, or wrong org / RXTSPOT_TOKEN). Create a VM pool in the Spot UI
  (MCP createVMPool is broken — vmCloudSpaceRef null), wait for an IP, then Reclaim
  and Point DNS. Drop any dead address from fleet.relaygateway.net A records.

apiVersion: v1
kind: ConfigMap
metadata:
  name: relay-boot-scripts
data:
  relay-boot.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    log() { echo "[relay-boot] $*" >&2; }
    INSTALL="${RELAY_INSTALL_ROOT:-/srv/relay}"
    DATA_ROOT="${RELAY_REPO_PATH:-$INSTALL/data}"
    CATALOG="${RELAY_MASTER_CATALOG_PATH:-$INSTALL/src/relay-master}"
    CATALOG_URL="${RELAY_MASTER_CATALOG_GIT_URL:-https://gitlab.com/clevertree/relay-master.git}"
    CATALOG_BRANCH="${RELAY_MASTER_CATALOG_BRANCH:-main}"
    GIT_PORT="${RELAY_GIT_PORT:-9418}"
    mkdir -p "$DATA_ROOT" "$INSTALL/state" "$INSTALL/www" "$(dirname "$CATALOG")"
    if [[ -n "${GITLAB_DEPLOY_USER:-}" && -n "${GITLAB_DEPLOY_TOKEN:-}" ]]; then
      git config --global credential.helper store
      printf 'https://%s:%s@gitlab.com\n' "$GITLAB_DEPLOY_USER" "$GITLAB_DEPLOY_TOKEN" >"${HOME}/.git-credentials"
      chmod 600 "${HOME}/.git-credentials"
      log "GitLab deploy-token credentials configured"
    fi
    if [[ ! -f "$CATALOG/relay-catalog.json" ]]; then
      log "Cloning relay-master worktree -> $CATALOG"
      if [[ -d "$CATALOG/.git" ]]; then
        git -C "$CATALOG" fetch origin "$CATALOG_BRANCH" && git -C "$CATALOG" checkout "$CATALOG_BRANCH"
      else
        find "$CATALOG" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
        git clone --depth 128 --branch "$CATALOG_BRANCH" "$CATALOG_URL" "$CATALOG"
      fi
    fi
    if [[ -x "$CATALOG/scripts/sync-relay-catalog.sh" ]]; then
      log "Running sync-relay-catalog.sh"
      RELAY_REPO_PATH="$DATA_ROOT" "$CATALOG/scripts/sync-relay-catalog.sh" || log "WARN: catalog forge sync failed"
    fi
    log "Starting git daemon on :$GIT_PORT"
    git daemon --reuseaddr --base-path="$DATA_ROOT" --export-all --informative-errors \
      --enable=receive-pack --port="$GIT_PORT" "$DATA_ROOT" &
    if [[ -n "${VERCEL_API_TOKEN:-}" && -x /scripts/vercel-dns-upsert.sh ]]; then
      PUB_IP=""
      for url in "https://api.ipify.org" "https://ipv4.icanhazip.com"; do
        PUB_IP=$(curl -fsS "$url" | tr -d '\r\n' || true)
        [[ "$PUB_IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] && break
      done
      if [[ -n "$PUB_IP" ]]; then
        if [[ -n "${RELAY_PUBLIC_HOSTNAME:-}" ]]; then
          VERCEL_API_TOKEN="${VERCEL_API_TOKEN}" VERCEL_TEAM_ID="${VERCEL_TEAM_ID:-}" \
            /scripts/vercel-dns-upsert.sh "${RELAY_PUBLIC_HOSTNAME}" "$PUB_IP" || true
        fi
        if [[ -n "${RELAY_EXTRA_DNS_FQDNS:-}" ]]; then
          IFS=',' read -ra extras <<< "${RELAY_EXTRA_DNS_FQDNS}"
          for fqdn in "${extras[@]}"; do
            fqdn=$(echo "$fqdn" | xargs)
            [[ -n "$fqdn" ]] || continue
            VERCEL_API_TOKEN="${VERCEL_API_TOKEN}" VERCEL_TEAM_ID="${VERCEL_TEAM_ID:-}" \
              /scripts/vercel-dns-upsert.sh "$fqdn" "$PUB_IP" || true
          done
        fi
      fi
    fi
    export RELAY_BIND="${RELAY_BIND:-0.0.0.0:8080}"
    log "Starting relay-gateway on $RELAY_BIND"
    exec /usr/local/bin/relay-gateway serve
  vercel-dns-upsert.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    FQDN="${1:?FQDN required}"; IP="${2:?IPv4 required}"; TTL="${RELAY_DNS_TTL:-60}"
    TOKEN="${VERCEL_API_TOKEN:-${VERCEL_TOKEN:-}}"; [[ -n "$TOKEN" ]] || exit 2
    DOMAIN="${FQDN#*.}"; NAME="${FQDN%%.*}"
    auth="Authorization: Bearer ${TOKEN}"; base="https://api.vercel.com"
    team_q=""; list_q="?"
    [[ -n "${VERCEL_TEAM_ID:-}" ]] && { team_q="?teamId=${VERCEL_TEAM_ID}"; list_q="?teamId=${VERCEL_TEAM_ID}&"; }
    list_raw=$(curl -fsS -H "$auth" "${base}/v4/domains/${DOMAIN}/records${list_q}type=A")
    mapfile -t rec_ids < <(echo "$list_raw" | jq -r --arg n "$NAME" '.records[]? | select(.name==$n and .type=="A") | .id // .uid')
    for rec_id in "${rec_ids[@]}"; do
      [[ -z "$rec_id" || "$rec_id" == "null" ]] && continue
      current=$(echo "$list_raw" | jq -r --arg id "$rec_id" '.records[]? | select((.id // .uid)==$id) | .value')
      [[ "$current" == "$IP" ]] && { echo "${FQDN} already -> ${IP}"; exit 0; }
      curl -fsS -X DELETE -H "$auth" "${base}/v4/domains/${DOMAIN}/records/${rec_id}${team_q}" >/dev/null
    done
    body=$(jq -n --arg n "$NAME" --arg v "$IP" --argjson ttl "$TTL" '{ name: $n, value: $v, type: "A", ttl: $ttl }')
    curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' -d "$body" \
      "${base}/v4/domains/${DOMAIN}/records${team_q}" >/dev/null
    echo "Created ${FQDN} -> ${IP}"

[package]
name = "relay-gateway"
# Update with each release
version = "0.3.15"
edition = "2021"
description = "Self-hosted relay gateway for HTTP plus git protocol content delivery, mesh bootstrap, and optional on-node TTS"
license = "MIT"
repository = "https://gitlab.com/clevertree/relay-gateway"
homepage = "https://gitlab.com/clevertree/relay-gateway"
readme = "README.md"
keywords = ["relay", "git", "gateway", "mesh", "tts"]
categories = ["web-programming::http-server", "command-line-utilities"]
exclude = ["libs/terraform", "libs/terraform/**"]

[lib]
name = "relay_server"
path = "src/lib.rs"

[[bin]]
name = "relay-gateway"
path = "src/main.rs"

[[bin]]
name = "relay-hook-handler"
path = "src/bin/relay-hook-handler.rs"

[[bin]]
name = "relay-branch-policy-check"
path = "src/bin/relay-branch-policy-check.rs"

[[bin]]
name = "relay-git-proxy"
path = "src/bin/relay-git-proxy.rs"

[[bin]]
name = "relay-ops"
path = "src/bin/relay-ops/main.rs"

[[bin]]
name = "relay-ssr-bake"
path = "src/bin/relay-ssr-bake.rs"

[[bin]]
name = "relay-brain"
path = "src/bin/relay-brain/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
git2 = { version = "0.18", features = ["vendored-openssl"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
mime_guess = "2"
percent-encoding = "2"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
jsonschema = "0.17"
http-body = "1"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
tower = "0.5"
tower-http = { version = "0.5", features = ["trace", "cors", "compression-gzip", "compression-br"] }
pulldown-cmark = "0.9"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls-pemfile = "2"
rustls = { version = "0.23", features = ["ring"] }
hook-transpiler = "0.2.5"
tempfile = "3"
redb = "2.6"
rusqlite = { version = "0.32", features = ["bundled"] }
relay-runtime = { path = "../relay-runtime" }
md2ast = { version = "1.0.2", path = "../../md2ast" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
instant-acme = "0.7"
rcgen = "0.13"
time = "0.3"
toml = "0.8"
dirs = "5"

[target.'cfg(unix)'.dependencies]
ksni = "0.3"

[dev-dependencies]
serial_test = "3"

[features]
# Enables IPFS end-to-end tests that spawn a local Kubo daemon.
# These tests are Linux-only and intended to run inside Docker or CI.
ipfs_tests = []
